name: Profile assets

# Regenerates the contribution graph and trophy SVGs on a schedule and commits
# them to the `assets` branch, so the README renders from files in this repo
# instead of depending on a third-party server being up at view time.
#
# First run: Actions tab -> "Profile assets" -> "Run workflow". That creates
# the `assets` branch; afterwards it refreshes itself every 12 hours.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Contribution activity graph
      # https://github.com/maurodesouza/github-readme-activity-graph-action
      - name: Render activity graph
        continue-on-error: true
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/activity-graph.svg
          options: bg_color=ffffff00&color=3fb950&line=3fb950&point=3fb950&area=true&area_color=3fb95022&title_color=3fb950&hide_border=true&custom_title=Contribution%20Activity&height=320

      # Profile trophies
      # https://github.com/Nirzak/github-trophies-self-deploy — a maintained
      # self-hosted instance of ryo-ma/github-profile-trophy. Snapshot it into a
      # committed file so the README never depends on the service at view time.
      # No token needed.
      - name: Render trophies
        continue-on-error: true
        run: |
          mkdir -p dist
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors \
            "https://nirzak-trophies.vercel.app/?username=${{ github.repository_owner }}&theme=tokyonight&no-frame=true&row=1&column=8&margin-w=8&margin-h=8" \
            -o dist/trophy.svg
          if [ "$(wc -c < dist/trophy.svg)" -lt 2000 ] || ! grep -q '</svg>' dist/trophy.svg; then
            echo "trophy snapshot looked invalid; dropping it"
            rm -f dist/trophy.svg
            exit 1
          fi

      - name: Publish to assets branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: assets
          force_orphan: true
          commit_message: "chore: refresh profile assets"
