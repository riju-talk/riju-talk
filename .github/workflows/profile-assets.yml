name: Profile assets

# Regenerates the contribution graph and trophy SVGs on a schedule and commits
# them to the `assets` branch, so the README never depends on a third-party
# server being up. Run once manually (Actions tab -> "Profile assets" -> "Run
# workflow") to create the branch, then it self-updates every 12 hours.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Contribution activity graph --------------------------------------
      # https://github.com/maurodesouza/github-readme-activity-graph-action
      - name: Render activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/activity-graph.svg
          options: >-
            bg_color=0d1117&color=8a2be2&line=8a2be2&point=ffffff&area=true&area_color=8a2be2&title_color=8a2be2&hide_border=true&custom_title=Contribution%20Activity&height=320

      # --- Profile trophies -----------------------------------------------
      # https://github.com/ryo-ma/github-profile-trophy
      # No first-party Action; the project ships render_svg.ts for local
      # generation. Args: USERNAME [OUTPUT_PATH] [THEME].
      - name: Checkout github-profile-trophy
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: master
          path: .trophy

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Render trophies
        working-directory: .trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp env-example .env || touch .env
          deno run --allow-net --allow-env --allow-read --allow-write \
            ./render_svg.ts "${{ github.repository_owner }}" ../dist/trophy.svg radical

      # --- Publish to the assets branch ------------------------------------
      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: assets
          force_orphan: true
          commit_message: "chore: refresh profile assets"
