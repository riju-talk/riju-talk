name: Profile assets

# Regenerates the contribution graph and trophy SVGs on a schedule and commits
# them to the `assets` branch, so the README renders from files in this repo
# instead of depending on a third-party server being up at view time.
#
# One-time setup for the trophy:
#   1. Create a classic Personal Access Token (no expiry or long-lived) with
#      scopes: read:user, public_repo
#      https://github.com/settings/tokens/new
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New repository
#      secret, name it PROFILE_TOKEN, paste the token.
# The activity graph works without it. Until PROFILE_TOKEN exists the trophy
# step is skipped and only the graph is published.
#
# First run: Actions tab -> "Profile assets" -> "Run workflow". That creates
# the `assets` branch; afterwards it refreshes itself every 12 hours.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TROPHY_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Contribution activity graph
      # https://github.com/maurodesouza/github-readme-activity-graph-action
      - name: Render activity graph
        continue-on-error: true
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/activity-graph.svg
          options: bg_color=ffffff00&color=2e6a4d&line=2e6a4d&point=2c637a&area=true&area_color=9fc1ac&title_color=2e6a4d&hide_border=true&custom_title=Contribution%20Activity&height=320

      # Profile trophies
      # https://github.com/ryo-ma/github-profile-trophy -> the CI generator that
      # project's README points to (Erik-Donath fork), pinned to a commit.
      # Needs a PAT: the built-in GITHUB_TOKEN can't read the user-contribution
      # GraphQL fields the generator queries.
      - name: Render trophies
        if: env.TROPHY_TOKEN != ''
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.PROFILE_TOKEN }}
          file: dist/trophy.svg
          theme: onedark
          max-rows: "2"
          no-frame: "true"
          no-background: "true"

      - name: Publish to assets branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: assets
          force_orphan: true
          commit_message: "chore: refresh profile assets"
